server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NO server-level `types {}` block here. A server-level types{} REPLACES the
    # http-level mime map (included from mime.types in the base nginx.conf), so
    # html/js/css fall back to application/octet-stream and the browser tries to
    # download index.html. Keep the map and scope the World ID wasm override.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # World ID IDKit ships a .wasm; IDKit fetches it via the MIME check, so
    # serve those files as application/wasm from their own location. The
    # location-scoped types{} only affects this regex location and CANNOT
    # shadow the http-level mime map (fixes the octet-stream download).
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long-lived immutable asset hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
